name: ChangeNotify
options:
  bundleIdPrefix: com.jimbritt
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"
packages:
  ChangeNotifyCore:
    path: ChangeNotifyCore
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ZANTG453Q3
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
targets:
  ChangeNotify-macOS:
    type: application
    platform: macOS
    sources: [Apps/macOS, Apps/Shared]
    dependencies:
      - package: ChangeNotifyCore
    entitlements:
      path: Apps/macOS/ChangeNotify.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
    info:
      path: Apps/macOS/Info.plist
      properties:
        CFBundleDisplayName: ChangeNotify
        LSUIElement: true            # menu bar only, no Dock icon
        ITSAppUsesNonExemptEncryption: false   # standard HTTPS only
        LSApplicationCategoryType: public.app-category.developer-tools
    settings:
      base:
        PRODUCT_NAME: ChangeNotify
        PRODUCT_BUNDLE_IDENTIFIER: com.jimbritt.changenotify
  ChangeNotify-iOS:
    type: application
    platform: iOS
    sources: [Apps/iOS, Apps/Shared]
    dependencies:
      - package: ChangeNotifyCore
    info:
      path: Apps/iOS/Info.plist
      properties:
        CFBundleDisplayName: ChangeNotify
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIBackgroundModes: [fetch]
        ITSAppUsesNonExemptEncryption: false   # standard HTTPS only
        BGTaskSchedulerPermittedIdentifiers: [com.jimbritt.changenotify.refresh]
        LSApplicationCategoryType: public.app-category.developer-tools
    settings:
      base:
        PRODUCT_NAME: ChangeNotify
        # Same ID as macOS so both can ship as one universal-purchase listing.
        PRODUCT_BUNDLE_IDENTIFIER: com.jimbritt.changenotify
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
schemes:
  ChangeNotify-macOS:
    build:
      targets:
        ChangeNotify-macOS: all
    run:
      config: Debug
    archive:
      config: Release
  ChangeNotify-iOS:
    build:
      targets:
        ChangeNotify-iOS: all
    run:
      config: Debug
    archive:
      config: Release
